apiVersion: v1
kind: Secret
metadata:
  name: cosigner-config
  namespace: paladin
stringData:
  cosigner.json: |
    {
      "listen": "0.0.0.0:9191",
      "privateKey": "<hex DER EC private key — generate with: cosigner -genkey>",
      "clientPublicKey": "",
      "allowedKeyIdentifiers": ["notary@node.*"]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosigner
  namespace: paladin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosigner
  template:
    metadata:
      labels:
        app: cosigner
    spec:
      containers:
        - name: cosigner
          image: ghcr.io/lopezpalacios/paladin-cluster/cosigner:latest
          ports:
            - containerPort: 9191
          volumeMounts:
            - name: config
              mountPath: /app
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: cosigner-config
---
apiVersion: v1
kind: Service
metadata:
  name: cosigner
  namespace: paladin
spec:
  selector:
    app: cosigner
  ports:
    - port: 9191
      targetPort: 9191
  type: ClusterIP
