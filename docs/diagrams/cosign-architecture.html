<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2-of-2 Notary Signing — Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>2-of-2 notary signing across two devices</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cosign-arch-title cosign-arch-desc">
      <title id="cosign-arch-title">2-of-2 notary signing across two devices</title>
      <desc id="cosign-arch-desc">Each device runs a Paladin node with a signing module that must obtain approval from the cosigner API on the other device before its local key can sign.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="40" y="60" width="420" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="82" y="64" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="114" y="73" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEVICE A</text>

      <rect x="540" y="60" width="420" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="582" y="64" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="614" y="73" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEVICE B</text>

      <!-- Arrows (before nodes) -->
      <!-- Module A -> Agent B (coral, HTTP) -->
      <path d="M 260,300 H 480 Q 500,300 500,320 V 420 Q 500,440 520,440 H 700"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Module B -> Agent A (coral, HTTP) -->
      <path d="M 740,300 H 520 Q 500,300 500,320 V 420 Q 500,440 480,440 H 300"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Node A -> Module A -->
      <line x1="170" y1="224" x2="170" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Node B -> Module B -->
      <line x1="830" y1="224" x2="830" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Local sign: Module A -> Node A (dashed return) -->
      <line x1="230" y1="300" x2="230" y2="224" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="770" y1="300" x2="770" y2="224" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Edge labels -->
      <text x="500" y="380" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /cosign</text>
      <text x="500" y="408" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /cosign</text>
      <text x="145" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Sign(payload)</text>
      <text x="845" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">Sign(payload)</text>
      <text x="238" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">signed</text>
      <text x="778" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">signed</text>

      <!-- Node A -->
      <rect x="80" y="168" width="180" height="56" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="170" y="192" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Paladin node A</text>
      <text x="170" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notary wallet · HD key</text>

      <!-- Module A -->
      <rect x="80" y="272" width="180" height="56" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="170" y="296" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">signing module</text>
      <text x="170" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notary-2of2.so</text>

      <!-- Agent A -->
      <rect x="80" y="412" width="180" height="56" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="170" y="436" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">cosigner agent A</text>
      <text x="170" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API · :9191 · agent key</text>

      <!-- Node B -->
      <rect x="740" y="168" width="180" height="56" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="830" y="192" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Paladin node B</text>
      <text x="830" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notary wallet · HD key</text>

      <!-- Module B -->
      <rect x="740" y="272" width="180" height="56" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="830" y="296" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">signing module</text>
      <text x="830" y="312" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notary-2of2.so</text>

      <!-- Agent B -->
      <rect x="740" y="412" width="180" height="56" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="830" y="436" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">cosigner agent B</text>
      <text x="830" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API · :9191 · agent key</text>

      <!-- Footnote -->
      <text x="500" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EITHER AGENT OFFLINE → THAT DEVICE'S NOTARY KEY CANNOT SIGN</text>
    </svg>
  </div>
</body>
</html>
